openapi: 3.0.3
info:
  title: hl7gw admin API
  description: >
    Administrative API for hl7gw. Exposes the configured channels and the
    messages persisted for each channel, including transform results, ACKs and
    delivery attempts, can replay a persisted message to its channel's
    destination, and can process a raw HL7 message submitted directly over
    HTTP.
  version: 1.0.0
servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: localhost
        description: Host the admin API is bound to.
      port:
        default: "8080"
        description: Port configured via admin_api.port.
security:
  - bearerAuth: []
tags:
  - name: Messages
    description: Persisted HL7 messages, their transforms, and delivery attempts.
  - name: Channels
    description: Configured inbound channels.
  - name: Operations
    description: Unauthenticated liveness, readiness and metrics endpoints for orchestrators and scrapers.
paths:
  /messages:
    get:
      operationId: listMessages
      summary: List persisted messages for a channel
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of the channel's messages, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesPage'
              example:
                data:
                  - id: 42
                    created_at: '2026-08-10T09:00:00Z'
                    updated_at: '2026-08-10T09:00:01Z'
                    received_at: '2026-08-10T09:00:00Z'
                    raw_message: "MSH|^~\\&|SENDER|FAC|RECV|FAC|20260810090000||ADT^A01|123|P|2.3"
                    transformed_xml: <ADT_A01>...</ADT_A01>
                    transform_error: null
                    ack_message: "MSH|^~\\&|RECV|FAC|SENDER|FAC|20260810090001||ACK|123|P|2.3"
                    ack_outcome: SUCCESS
                    delivery_attempts:
                      - attempted_at: '2026-08-10T09:00:01Z'
                        outcome: SUCCESS
                        response_status_code: 200
                        response_body: OK
                        payload: <ADT_A01>...</ADT_A01>
                        origin: INBOUND
                        created_at: '2026-08-10T09:00:01Z'
                        updated_at: '2026-08-10T09:00:01Z'
                pagination:
                  pageNumber: 1
                  pageSize: 50
                  total: 1
                links:
                  self: /messages?channel=adt&pageNumber=1&pageSize=50
                  next: null
                  prev: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/InternalError'
  /messages/{id}:
    get:
      operationId: getMessage
      summary: Get a persisted message by id
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/MessageID'
        - $ref: '#/components/parameters/Channel'
      responses:
        '200':
          description: The persisted message with its transform, ACK and delivery attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: 42
                created_at: '2026-08-10T09:00:00Z'
                updated_at: '2026-08-10T09:00:01Z'
                received_at: '2026-08-10T09:00:00Z'
                raw_message: "MSH|^~\\&|SENDER|FAC|RECV|FAC|20260810090000||ADT^A01|123|P|2.3"
                transformed_xml: <ADT_A01>...</ADT_A01>
                transform_error: null
                ack_message: "MSH|^~\\&|RECV|FAC|SENDER|FAC|20260810090001||ACK|123|P|2.3"
                ack_outcome: SUCCESS
                delivery_attempts:
                  - attempted_at: '2026-08-10T09:00:01Z'
                    outcome: SUCCESS
                    response_status_code: 200
                    response_body: OK
                    payload: <ADT_A01>...</ADT_A01>
                    origin: INBOUND
                    created_at: '2026-08-10T09:00:01Z'
                    updated_at: '2026-08-10T09:00:01Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/InternalError'
  /channels:
    get:
      operationId: listChannels
      summary: List configured channels
      tags: [Channels]
      responses:
        '200':
          description: All channels in the gateway's configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelList'
              example:
                channels:
                  - name: adt
                    tcp_listener:
                      max_connections: 10
                      port: 2575
                      idle_timeout_seconds: 86400
                      tls:
                        mode: mtls
                        client_ca_path: ./client-ca.pem
                        server_cert_path: ./server-cert.pem
                        server_pk_path: ./server-key.pem
                        min_version: 1.2
                    destination:
                      url: https://ehr.example.internal/hl7
                      auth:
                        type: bearer
                        token_env: EHR_TOKEN
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/InternalError'
  /replay:
    post:
      operationId: replayMessage
      summary: Replay a persisted message to its channel's destination
      tags: [Messages]
      requestBody:
        description: The persisted message to replay.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRequest'
            example:
              channel: adt
              message_id: 42
      responses:
        '200':
          description: The message was redelivered; the successful attempt as recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayedAttempt'
              example:
                attempted_at: '2026-08-10T09:05:00Z'
                outcome: SUCCESS
                response_status_code: 200
                response_body: OK
                payload: <ADT_A01>...</ADT_A01>
                origin: REPLAY
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        default:
          $ref: '#/components/responses/InternalError'
  /process-message:
    post:
      operationId: processMessage
      summary: Process a raw HL7 message through a channel's pipeline
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/ProcessMode'
      requestBody:
        description: The channel to process on and the raw HL7 message.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessMessageRequest'
            example:
              channel: adt
              message: "MSH|^~\\&|SENDER|FAC|RECV|FAC|20260810090000||ADT^A01|123|P|2.3"
      responses:
        '200':
          description: >-
            In full mode, the message was delivered; the persisted record with
            its transform and delivery attempts. In dry-run mode, the transform
            the message would produce; nothing was persisted or delivered.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Message'
                  - $ref: '#/components/schemas/DryRunMessage'
              example:
                id: 42
                created_at: '2026-08-10T09:00:00Z'
                updated_at: '2026-08-10T09:00:01Z'
                received_at: '2026-08-10T09:00:00Z'
                raw_message: "MSH|^~\\&|SENDER|FAC|RECV|FAC|20260810090000||ADT^A01|123|P|2.3"
                transformed_xml: <ADT_A01>...</ADT_A01>
                transform_error: null
                ack_message: null
                ack_outcome: null
                delivery_attempts:
                  - attempted_at: '2026-08-10T09:00:01Z'
                    outcome: SUCCESS
                    response_status_code: 200
                    response_body: OK
                    payload: <ADT_A01>...</ADT_A01>
                    origin: INBOUND
                    created_at: '2026-08-10T09:00:01Z'
                    updated_at: '2026-08-10T09:00:01Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        default:
          $ref: '#/components/responses/InternalError'
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      description: Answers 200 whenever the process is serving HTTP. It checks nothing else, so orchestrators restart the gateway only when it is wedged.
      tags: [Operations]
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            text/plain:
              schema:
                type: string
                enum: [ok]
              example: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/InternalError'
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      description: Answers 200 when every channel's journal database answers a query, and 503 naming the first channel whose database does not. The downstream destination is deliberately not probed; the gateway accepts and journals messages whether or not it is reachable.
      tags: [Operations]
      security: []
      responses:
        '200':
          description: Every channel can accept traffic.
          content:
            text/plain:
              schema:
                type: string
                enum: [ok]
              example: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics
      description: Gateway metrics in the Prometheus text exposition format (version 0.0.4), as served by every Prometheus-compatible scraper's target.
      tags: [Operations]
      security: []
      responses:
        '200':
          description: The current metric samples.
          content:
            text/plain:
              example: |
                # HELP hl7gw_messages_total Inbound messages by processing outcome.
                # TYPE hl7gw_messages_total counter
                hl7gw_messages_total{channel="adt",outcome="success"} 42
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token from the environment variable named by admin_api.token_env in the config file.
  headers:
    Allow:
      description: Methods this endpoint accepts.
      required: true
      schema:
        type: string
        pattern: '.*'
  parameters:
    Channel:
      name: channel
      in: query
      required: true
      description: Name of the channel the messages belong to.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]+$'
    MessageID:
      name: id
      in: path
      required: true
      description: ID of the persisted message.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9223372036854775807
    ProcessMode:
      name: mode
      in: query
      required: true
      description: Whether to fully process the message (full) or only parse and transform it (dry-run).
      schema:
        type: string
        enum: [full, dry-run]
    PageNumber:
      name: pageNumber
      in: query
      description: 1-based page number.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000000000
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Number of messages per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 50
  responses:
    BadRequest:
      description: The request parameters are invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: pageSize must be a positive integer at most 500, got "501"
    Unauthorized:
      description: The bearer token is missing or wrong.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: invalid or missing bearer token
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: no channel named "adt"
    MethodNotAllowed:
      description: The endpoint exists but does not support this method.
      headers:
        Allow:
          $ref: '#/components/headers/Allow'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Method Not Allowed
            status: 405
            detail: POST is not supported on /messages
    TooManyRequests:
      description: The message is not yet eligible for replay.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            detail: message 42 has no delivery attempts to replay
    UnprocessableEntity:
      description: The message could not be parsed as HL7.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Entity
            status: 422
            detail: message could not be parsed as HL7
    BadGateway:
      description: The destination did not accept the message.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Gateway
            status: 502
            detail: replay delivery failed
    ServiceUnavailable:
      description: A channel's journal database is not answering.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            detail: channel adt is not ready
    InternalError:
      description: Unexpected server failure.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: replay failed
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          pattern: '.*'
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
        detail:
          type: string
          pattern: '.*'
    DeliveryAttempt:
      type: object
      description: One attempt to deliver a transformed message to its destination.
      required: [attempted_at, outcome, payload, origin, created_at, updated_at]
      properties:
        attempted_at:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [SUCCESS, FAILED]
        response_status_code:
          type: integer
          format: int32
          nullable: true
          minimum: 100
          maximum: 599
        response_body:
          type: string
          nullable: true
          pattern: '.*'
        payload:
          type: string
          pattern: '.*'
        origin:
          type: string
          enum: [INBOUND, REPLAY]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReplayRequest:
      type: object
      description: Identifies the persisted message to replay.
      required: [channel, message_id]
      properties:
        channel:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
        message_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
    ProcessMessageRequest:
      type: object
      description: A raw HL7 message to process through a channel's pipeline.
      required: [channel, message]
      properties:
        channel:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
        message:
          type: string
          pattern: '.*'
          minLength: 1
    ReplayedAttempt:
      type: object
      description: The successful delivery attempt recorded by a replay.
      required: [attempted_at, outcome, payload, origin]
      properties:
        attempted_at:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [SUCCESS]
        response_status_code:
          type: integer
          format: int32
          nullable: true
          minimum: 100
          maximum: 599
        response_body:
          type: string
          nullable: true
          pattern: '.*'
        payload:
          type: string
          pattern: '.*'
        origin:
          type: string
          enum: [REPLAY]
    Message:
      type: object
      description: A persisted HL7 message and its transform, ACK, and delivery history.
      required: [id, created_at, updated_at, received_at, raw_message, transformed_xml, transform_error, ack_message, ack_outcome, delivery_attempts]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        raw_message:
          type: string
          pattern: '.*'
        transformed_xml:
          type: string
          nullable: true
          pattern: '.*'
        transform_error:
          type: string
          nullable: true
          enum: [COULD_NOT_PARSE_HL7, null]
        ack_message:
          type: string
          nullable: true
          pattern: '.*'
        ack_outcome:
          type: string
          nullable: true
          enum: [SUCCESS, FAILED, null]
        delivery_attempts:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryAttempt'
    DryRunMessage:
      type: object
      description: The transform a message would produce; nothing was persisted or delivered.
      required: [received_at, raw_message, transformed_xml, transform_error]
      additionalProperties: false
      properties:
        received_at:
          type: string
          format: date-time
        raw_message:
          type: string
          pattern: '.*'
        transformed_xml:
          type: string
          nullable: true
          pattern: '.*'
        transform_error:
          type: string
          nullable: true
          enum: [COULD_NOT_PARSE_HL7, null]
    PaginationMeta:
      type: object
      description: Pagination state for a page of results.
      required: [pageNumber, pageSize, total]
      properties:
        pageNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000000
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
        total:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
    PaginationLinks:
      type: object
      description: HAL-style links for navigating a paginated result.
      required: [self]
      properties:
        self:
          type: string
          format: uri-reference
        next:
          type: string
          format: uri-reference
          nullable: true
        prev:
          type: string
          format: uri-reference
          nullable: true
    MessagesPage:
      type: object
      description: One page of persisted messages for a channel.
      required: [data, pagination, links]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          $ref: '#/components/schemas/PaginationLinks'
    Channel:
      type: object
      description: A configured inbound MLLP channel.
      required: [name, tcp_listener, destination]
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
        tcp_listener:
          $ref: '#/components/schemas/TCPListener'
        destination:
          $ref: '#/components/schemas/Destination'
    TCPListener:
      type: object
      description: The inbound TCP listener a channel accepts MLLP traffic on.
      required: [max_connections, port, idle_timeout_seconds, tls]
      properties:
        max_connections:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        idle_timeout_seconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 31536000
        tls:
          $ref: '#/components/schemas/ChannelTLS'
    ChannelTLS:
      type: object
      description: >-
        TLS settings for a channel's TCP listener. When mode is mtls, the
        gateway serves the configured certificate and requires-and-verifies
        client certificates against the client CA pool; the path and
        min_version fields are only present in mtls mode.
      required: [mode]
      properties:
        mode:
          type: string
          enum: ['off', mtls]
        client_ca_path:
          type: string
          pattern: '^.+$'
        server_cert_path:
          type: string
          pattern: '^.+$'
        server_pk_path:
          type: string
          pattern: '^.+$'
        min_version:
          type: number
    Destination:
      type: object
      description: The downstream HTTP endpoint a channel forwards to.
      required: [url, auth]
      properties:
        url:
          type: string
          format: uri
        auth:
          type: object
          description: >-
            How the gateway authenticates to the destination. token_env is the
            name of the environment variable the token is read from; the token
            value itself never appears in this API.
          required: [type, token_env]
          properties:
            type:
              type: string
              enum: [bearer]
            token_env:
              type: string
              pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    ChannelList:
      type: object
      description: All channels configured on the gateway.
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
