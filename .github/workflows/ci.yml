name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint from its release, at the version pinned in go.mod
        run: |
          set -euo pipefail
          gl=$(go list -m -f '{{.Version}}' github.com/golangci/golangci-lint/v2)
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"

          gl_base="https://github.com/golangci/golangci-lint/releases/download/$gl/golangci-lint-${gl#v}"
          curl -sSfLO "$gl_base-linux-amd64.tar.gz"
          curl -sSfL "$gl_base-checksums.txt" | grep ' golangci-lint-.*-linux-amd64.tar.gz$' | sha256sum -c
          tar -xzf "golangci-lint-${gl#v}-linux-amd64.tar.gz" --strip-components=1 -C "$bin" "golangci-lint-${gl#v}-linux-amd64/golangci-lint"

          echo "$bin" >> "$GITHUB_PATH"
      - name: make check
        run: make check GOLANGCI_LINT=golangci-lint
